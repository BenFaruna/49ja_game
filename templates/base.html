<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{% block title %}49ja Analytics Dashboard{% endblock %}</title>
  <script>
    function formatLocalTime(isoStr) {
      if (!isoStr) return '';
      try {
        if (!isoStr.endsWith('Z') && !isoStr.includes('+')) {
          isoStr += 'Z';
        }
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      } catch (e) {
        return isoStr;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.local-time').forEach(el => {
        const rawIso = el.getAttribute('data-utc');
        if (rawIso) {
          el.innerText = formatLocalTime(rawIso);
        }
      });
    });
  </script>
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <a href="{{ url_for('home') }}" class="nav-brand">
      🎯 49ja <span>Analytics</span>
    </a>

    <nav class="nav-links">
      <a href="{{ url_for('home') }}" class="nav-link {% if active_tab == 'dashboard' %}active{% endif %}">
        📊 Dashboard
      </a>
      <a href="{{ url_for('history') }}" class="nav-link {% if active_tab == 'history' %}active{% endif %}">
        📜 Draw History
      </a>
    </nav>

    <div class="live-indicator">
      <span class="pulse-dot"></span>
      Scraper Live
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    {% block content %}
    {% endblock %}
  </main>
</body>
</html>
